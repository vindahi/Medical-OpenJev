<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">medical-openjev decision-gating method</title>
  <desc id="description">A medical language model response passes through medical-openjev, which evaluates evidence sufficiency and specialty routing, then selects either act or escalate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071521"/>
      <stop offset="1" stop-color="#102A3B"/>
    </linearGradient>
    <linearGradient id="gate" x1="445" y1="105" x2="745" y2="375" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D5A75"/>
      <stop offset="1" stop-color="#123A55"/>
    </linearGradient>
    <linearGradient id="act" x1="895" y1="101" x2="1115" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35C980"/>
      <stop offset="1" stop-color="#15995A"/>
    </linearGradient>
    <linearGradient id="escalate" x1="895" y1="284" x2="1115" y2="379" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFAE52"/>
      <stop offset="1" stop-color="#E1772B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 6L1 11" stroke="#7EC7D7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="480" rx="30" fill="url(#background)"/>
  <circle cx="85" cy="76" r="150" fill="#1D8090" fill-opacity="0.10"/>
  <circle cx="1120" cy="410" r="180" fill="#2C86B1" fill-opacity="0.08"/>
  <path d="M44 420H1156" stroke="#7EC7D7" stroke-opacity="0.12"/>

  <text x="62" y="66" fill="#91D9E5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.5">MEDICAL AI SAFETY LAYER</text>
  <text x="62" y="104" fill="#F4FBFC" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Calibrated decision gating, not diagnosis generation</text>

  <g filter="url(#shadow)">
    <rect x="62" y="167" width="276" height="192" rx="22" fill="#0D2433" stroke="#2E6477" stroke-width="2"/>
  </g>
  <rect x="88" y="193" width="58" height="58" rx="15" fill="#16465C"/>
  <path d="M108 213C108 207.477 112.477 203 118 203C123.523 203 128 207.477 128 213V219H134C137.314 219 140 221.686 140 225C140 228.314 137.314 231 134 231H128V238C128 243.523 123.523 248 118 248C112.477 248 108 243.523 108 238V231H102C98.6863 231 96 228.314 96 225C96 221.686 98.6863 219 102 219H108V213Z" fill="#B9EEF1"/>
  <text x="88" y="285" fill="#F4FBFC" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Medical LLM</text>
  <text x="88" y="315" fill="#9DB9C4" font-family="Arial, Helvetica, sans-serif" font-size="17">Response + clinical context</text>

  <path d="M340 263H434" stroke="#7EC7D7" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="445" y="150" width="306" height="226" rx="24" fill="url(#gate)" stroke="#5BC1D6" stroke-width="2"/>
  </g>
  <circle cx="490" cy="202" r="24" fill="#0A2A3D" stroke="#83D8E8" stroke-width="2"/>
  <path d="M490 188V216M476 202H504" stroke="#BDF5FA" stroke-width="4" stroke-linecap="round"/>
  <text x="528" y="196" fill="#A6E9F2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">MEDICAL-OPENJEV</text>
  <text x="476" y="248" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Evidence sufficiency</text>
  <text x="476" y="280" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">+ specialty routing</text>
  <rect x="476" y="305" width="244" height="42" rx="12" fill="#0A2B3D" fill-opacity="0.55"/>
  <circle cx="497" cy="326" r="7" fill="#64DEB0" filter="url(#glow)"/>
  <text x="514" y="332" fill="#D5F5F8" font-family="Arial, Helvetica, sans-serif" font-size="16">Calibrated trust score</text>

  <path d="M752 222H829C847 222 858 211 858 193V171H880" stroke="#7EC7D7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M752 303H829C847 303 858 314 858 332V338H880" stroke="#7EC7D7" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="895" y="128" width="239" height="94" rx="20" fill="url(#act)"/>
  </g>
  <circle cx="932" cy="175" r="18" fill="#F1FFF8" fill-opacity="0.93"/>
  <path d="M923 175L929 181L941 168" stroke="#169C5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="967" y="170" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">ACT</text>
  <text x="967" y="196" fill="#E5FFF1" font-family="Arial, Helvetica, sans-serif" font-size="15">Sufficiently trustworthy</text>

  <g filter="url(#shadow)">
    <rect x="895" y="291" width="239" height="94" rx="20" fill="url(#escalate)"/>
  </g>
  <circle cx="932" cy="338" r="18" fill="#FFF8EC" fill-opacity="0.94"/>
  <path d="M932 327V342M932 349V350" stroke="#D8752C" stroke-width="4" stroke-linecap="round"/>
  <text x="967" y="333" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">ESCALATE</text>
  <text x="967" y="359" fill="#FFF5E8" font-family="Arial, Helvetica, sans-serif" font-size="15">Ask, route, or hand off</text>

  <text x="62" y="448" fill="#7295A4" font-family="Arial, Helvetica, sans-serif" font-size="14">Frozen ModernBERT backbone · Pluggable heads · Proper-scoring-rule calibration</text>
</svg>
